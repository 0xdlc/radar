[project]
name = "radar"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
dependencies = [
    "alive-progress==3.1.5",
    "discord-webhook==1.3.0",
    "dumpit==0.6.0",
    "flightradarapi==1.3.12",
    "geojson==3.1.0",
    "ijson==3.2.3",
    "numpy==1.26.3",
    "progress==1.6",
    "requests[socks]>=2.32.3",
    "urllib3==2.1.0",
    "cloudscraper>=1.2.71",
    "httpx[http2]>=0.27.2",
    "bson>=0.5.10",
    "scrapy>=2.11.2",
    "ipython>=8.27.0",
    "socksio>=1.0.0",
    "blinker==1.7.0",
    "curl-cffi>=0.7.3",
    "redis>=5.2.0",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]
